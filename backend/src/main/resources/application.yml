spring:
  application:
    name: hr-ai-recruitment

  datasource:
    url: jdbc:postgresql://db:5432/hr_ai
    username: hr_user
    password: super-secret
    driver-class-name: org.postgresql.Driver


  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB
#      embedding:
#    vectorstore:
#      pgvector:
#        initialize-schema: true
#        table-name: document_chunks
#        index-type: hnsw
#        distance-type: COSINE_DISTANCE

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:80}
  cv-ingestion:
    max-pdf-size: 20971520
    max-archive-size: 104857600
    max-archive-entries: 100
    max-expanded-size: 104857600
    max-compression-ratio: 100
    minimum-text-length: 50
    initial-resource: classpath:intial/CVs.zip
    initial-import-enabled: true
