name: Deploy production

on:
  release:
    types:
      - published

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  resolve:
    name: Resolve validated release
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Checkout release history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Set lowercase image names
        shell: bash
        run: |
          repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMAGE_NAME=$repository/hr-ai-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE_NAME=$repository/hr-ai-frontend" >> "$GITHUB_ENV"

      - name: Resolve release commit
        id: revision
        shell: bash
        run: echo "sha=$(git rev-list -n 1 '${{ github.event.release.tag_name }}')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Require staging validation aliases
        shell: bash
        run: |
          revision='${{ steps.revision.outputs.sha }}'
          docker buildx imagetools inspect \
            "$REGISTRY/$BACKEND_IMAGE_NAME:staging-validated-$revision"
          docker buildx imagetools inspect \
            "$REGISTRY/$FRONTEND_IMAGE_NAME:staging-validated-$revision"

  deploy:
    name: Promote to production
    needs: resolve
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://hr.nevgiuai.com
    env:
      REVISION: ${{ needs.resolve.outputs.revision }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
    steps:
      - name: Checkout release deployment files
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.revision }}

      - name: Set lowercase image names
        shell: bash
        run: |
          repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMAGE_NAME=$repository/hr-ai-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE_NAME=$repository/hr-ai-frontend" >> "$GITHUB_ENV"

      - name: Configure SSH
        shell: bash
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy deployment bundle
        run: |
          scp -i ~/.ssh/deploy_key \
            deploy/Caddyfile deploy/compose.yml deploy/deploy.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:/opt/nevgiu/deploy/"

      - name: Log production VPS in to GHCR
        shell: bash
        run: |
          printf '%s' "$GHCR_TOKEN" | \
            ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
              "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"

      - name: Deploy staging-validated images
        shell: bash
        run: |
          backend_image="$REGISTRY/$BACKEND_IMAGE_NAME:$REVISION"
          frontend_image="$REGISTRY/$FRONTEND_IMAGE_NAME:$REVISION"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod 750 /opt/nevgiu/deploy/deploy.sh && /opt/nevgiu/deploy/deploy.sh '$backend_image' '$frontend_image'"

      - name: Smoke-test production
        run: |
          curl --fail --show-error --silent --retry 12 --retry-delay 5 \
            https://api.hr.nevgiuai.com/actuator/health
          curl --fail --show-error --silent --head --retry 12 --retry-delay 5 \
            https://hr.nevgiuai.com/

      - name: Summarize deployment
        run: |
          {
            echo "### Production deployment"
            echo "- Release: \`${{ github.event.release.tag_name }}\`"
            echo "- Commit: \`$REVISION\`"
            echo "- Frontend: https://hr.nevgiuai.com"
            echo "- API: https://api.hr.nevgiuai.com"
          } >> "$GITHUB_STEP_SUMMARY"
