name: Deploy staging

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publish immutable images
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set lowercase image names
        shell: bash
        run: |
          repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMAGE_NAME=$repository/hr-ai-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE_NAME=$repository/hr-ai-frontend" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and publish frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy:
    name: Deploy and smoke-test staging
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging-hr.nevgiuai.com
    env:
      REVISION: ${{ github.event.workflow_run.head_sha }}
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set lowercase image names
        shell: bash
        run: |
          repository=$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMAGE_NAME=$repository/hr-ai-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE_NAME=$repository/hr-ai-frontend" >> "$GITHUB_ENV"

      - name: Configure SSH
        shell: bash
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Copy deployment bundle
        run: |
          scp -i ~/.ssh/deploy_key \
            deploy/Caddyfile deploy/compose.yml deploy/deploy.sh \
            "$DEPLOY_USER@$DEPLOY_HOST:/opt/nevgiu/deploy/"

      - name: Log staging VPS in to GHCR
        shell: bash
        run: |
          printf '%s' "$GHCR_TOKEN" | \
            ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
              "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"

      - name: Deploy immutable images
        shell: bash
        run: |
          backend_image="$REGISTRY/$BACKEND_IMAGE_NAME:$REVISION"
          frontend_image="$REGISTRY/$FRONTEND_IMAGE_NAME:$REVISION"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            "chmod 750 /opt/nevgiu/deploy/deploy.sh && /opt/nevgiu/deploy/deploy.sh '$backend_image' '$frontend_image'"

      - name: Smoke-test staging
        run: |
          curl --fail --show-error --silent --retry 12 --retry-delay 5 \
            https://staging-api.hr.nevgiuai.com/actuator/health
          curl --fail --show-error --silent --head --retry 12 --retry-delay 5 \
            https://staging-hr.nevgiuai.com/

      - name: Mark images as staging validated
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish validation aliases
        run: |
          docker buildx imagetools create \
            --tag "$REGISTRY/$BACKEND_IMAGE_NAME:staging-validated-$REVISION" \
            "$REGISTRY/$BACKEND_IMAGE_NAME:$REVISION"
          docker buildx imagetools create \
            --tag "$REGISTRY/$FRONTEND_IMAGE_NAME:staging-validated-$REVISION" \
            "$REGISTRY/$FRONTEND_IMAGE_NAME:$REVISION"

      - name: Summarize deployment
        run: |
          {
            echo "### Staging deployment"
            echo "- Commit: \`$REVISION\`"
            echo "- Frontend: https://staging-hr.nevgiuai.com"
            echo "- API: https://staging-api.hr.nevgiuai.com"
          } >> "$GITHUB_STEP_SUMMARY"
